name: Security - OSS Stack (Trivy + Semgrep + Gitleaks)

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1" # semanal (lunes 06:00 UTC)

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # --- PHP deps (opcional para consistencia) ---
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer deps (no interaction)
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit (no-fail)
        run: composer audit --locked || true

      # --- TRIVY (Vulns + SBOM/secrets básicos) ---
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master

      - name: Trivy FS scan → SARIF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          hide-progress: true
          skip-dirs: 'vendor,node_modules,storage,public,bootstrap/cache'
          scanners: 'vuln,secret,misconfig,license' # incluye lockfiles como composer.lock

      - name: Upload SARIF (Trivy)
        if: hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      # --- SEMGREP (SAST PHP/Laravel con reglas públicas) ---
      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          pip3 install semgrep

      - name: Semgrep scan → SARIF
        run: |
          semgrep --version
          # Reglas enfocadas en seguridad PHP + OWASP + secrets
          semgrep \
            --config p/php \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error \
            --skip-unknown-extensions \
            --exclude vendor --exclude node_modules --exclude storage --exclude public --exclude bootstrap/cache \
            --sarif -o semgrep.sarif \
            || true

      - name: Upload SARIF (Semgrep)
        if: hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      # --- GITLEAKS (secret scanning adicional) ---
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_$(uname -s | tr '[:upper:]' '[:lower:]')_x64.tar.gz \
          | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks scan → SARIF
        run: |
          gitleaks detect --no-git \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exclude-forks \
            || true

      - name: Upload SARIF (Gitleaks)
        if: hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
