name: Security - Snyk

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1" # escaneo semanal (lunes 06:00 UTC)

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install deps
        run: composer install --no-interaction --prefer-dist

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      # ---------- Dependencias (OSS) ----------
      - name: Snyk Open Source (deps) + SARIF
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # Escaneo estándar (no rompe el job aquí)
          snyk test --all-projects --severity-threshold=high || true
          # Genera SARIF para Code scanning
          snyk test --all-projects --sarif-file-output=snyk-oss.sarif || true
          # Enviar proyecto a Snyk para monitoreo continuo
          snyk monitor --all-projects || true

      # ---------- Código (SAST) ----------
      - name: Snyk Code (SAST) - genera SARIF si está habilitado
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # Intentar generar SARIF (si Snyk Code no está habilitado, imprime error en stderr)
          snyk code test --sarif 1> snyk-code.sarif 2> snyk-code.err || true

          # Validación simple para evitar subir texto de error como SARIF
          if [ -s snyk-code.sarif ] && grep -q '"version"' snyk-code.sarif; then
            echo "Valid SARIF generated for Snyk Code."
          else
            echo "No valid SARIF for Snyk Code (probably not enabled). Skipping upload."
            rm -f snyk-code.sarif
          fi

      # ---------- Subida de SARIF a GitHub Security ----------
      - name: Upload SARIF (Code)
        if: hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif

      - name: Upload SARIF (OSS)
        if: hashFiles('snyk-oss.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-oss.sarif

      # ---------- Política de ruptura (opcional pero recomendado) ----------
      - name: Enforce High/Critical
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high
